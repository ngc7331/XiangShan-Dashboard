<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XiangShan Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <p>XiangShan Dashboard has been moved to official OpenXiangShan organization.</p>
    <p>You will be redirected to the new version in <span id="countdown">5</span> seconds.</p>
    <p>If you are not redirected automatically, please visit <a href="https://dashboard.xiangshan.cc">https://dashboard.xiangshan.cc</a>.</p>
    <script>
      const countdown = document.getElementById('countdown');
      let timeLeft = 5;

      const timer = setInterval(() => {
        timeLeft--;
        countdown.textContent = timeLeft;

        if (timeLeft === 0) {
          clearInterval(timer);
          window.location.href = "https://dashboard.xiangshan.cc";
        }
      }, 1000);
    </script>
  </body>
</html>
